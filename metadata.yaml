name: matrix_plugin
module: main
display_name: 终末地基质
desc: 淤积点武器与地区查询插件。支持武器列表、单个武器详情、多武器组合优化、词条查询等功能。
help: |
  指令列表：
  - /基质 武器          - 所有武器列表
  - /基质 词条          - 词条说明图
  - /基质 <武器名/编号> - 查询武器详情及推荐刷取方案
  - /基质 <武器1,武器2> - 武器组合刷取
  - /基质 基础/附加/技能 - 按词条查询（基础和附加支持模糊匹配）
version: 1.0.1
author: Courison
repo: https://github.com/Courison/astrbot_plugin_matrix
license: MIT
dependencies:
  - Pillow>=9.0.0